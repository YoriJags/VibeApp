<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VIIBE — Big Screen</title>
<style>
  :root {
    --bg: #06060B; --card: #0D0D16; --text: #F2F0FF; --dim: #8A87A8;
    --lvl: #5544FF; /* replaced live per level */
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--text); overflow: hidden;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; gap: 3.2vh; position: relative;
  }
  /* ambient glow behind everything, colored by level */
  #glow {
    position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse 70% 55% at 50% 46%, var(--lvl) 0%, transparent 62%);
    opacity: .16; transition: opacity 1.2s ease; filter: blur(2px);
  }
  #brand { font-size: 2.6vh; letter-spacing: .9em; color: var(--dim); text-indent: .9em; }
  #venue { font-size: 6.5vh; font-weight: 800; letter-spacing: .02em; line-height: 1.05; max-width: 90vw; }
  #level {
    font-size: 17vh; font-weight: 900; letter-spacing: .06em; line-height: 1;
    color: var(--lvl); text-shadow: 0 0 6vh var(--lvl);
    transition: color .8s ease, text-shadow .8s ease;
  }
  #level.electric { animation: pulse 1.15s ease-in-out infinite; }
  @keyframes pulse {
    0%, 100% { text-shadow: 0 0 6vh var(--lvl); transform: scale(1); }
    50% { text-shadow: 0 0 11vh var(--lvl), 0 0 18vh var(--lvl); transform: scale(1.025); }
  }
  #bar-wrap { width: 62vw; max-width: 1100px; }
  #bar-track {
    height: 3.4vh; border-radius: 3.4vh; background: #16151F;
    overflow: hidden; box-shadow: inset 0 0 1.2vh rgba(0,0,0,.8);
  }
  #bar-fill {
    height: 100%; width: 0%; border-radius: 3.4vh;
    background: linear-gradient(90deg, #5544FF, var(--lvl));
    box-shadow: 0 0 2.4vh var(--lvl);
    transition: width 1s cubic-bezier(.2,.8,.2,1), background .8s ease;
  }
  #next { margin-top: 1.4vh; font-size: 2.4vh; color: var(--dim); letter-spacing: .12em; }
  #next b { color: var(--text); }
  #stats { display: flex; gap: 3.5vw; }
  .stat {
    background: var(--card); border: 1px solid #1D1C2B; border-radius: 2vh;
    padding: 2.4vh 3.4vw; min-width: 16vw;
  }
  .stat .n { font-size: 6.2vh; font-weight: 800; color: var(--text); line-height: 1.1; }
  .stat .l { font-size: 1.9vh; color: var(--dim); letter-spacing: .18em; margin-top: .6vh; }
  .stat.watch .n { color: #FFD700; text-shadow: 0 0 3vh rgba(255,215,0,.35); }
  #strata { font-size: 3.2vh; color: var(--dim); }
  #strata b { color: var(--lvl); font-size: 4vh; }
  #foot { position: absolute; bottom: 2.5vh; font-size: 1.9vh; color: #55536E; letter-spacing: .28em; }
  #err { color: #FF5566; font-size: 2.4vh; display: none; }
</style>
</head>
<body>
  <div id="glow"></div>
  <div id="brand">V I I B E</div>
  <div id="venue">—</div>
  <div id="level">DORMANT</div>
  <div id="bar-wrap">
    <div id="bar-track"><div id="bar-fill"></div></div>
    <div id="next">CHARGE THE ROOM — TAP THE REACTOR IN THE APP</div>
  </div>
  <div id="stats">
    <div class="stat"><div class="n" id="scouts">0</div><div class="l">SCOUTS IN THE ROOM</div></div>
    <div class="stat watch"><div class="n" id="watchers">0</div><div class="l">WATCHING FROM ACROSS LAGOS</div></div>
    <div class="stat"><div class="n" id="strata-n">—</div><div class="l">CITY ENERGY STRATA</div></div>
  </div>
  <div id="err">signal lost — retrying…</div>
  <div id="foot">LIVE HUMAN ENERGY · VERIFIED BY SCOUTS · NEVER FAKED</div>

<script>
const venueId = location.pathname.split("/").filter(Boolean).pop();
const $ = id => document.getElementById(id);

async function j(path) {
  const r = await fetch(path, { cache: "no-store" });
  if (!r.ok) throw new Error(path + " " + r.status);
  return r.json();
}

function ordinal(n) {
  const s = ["th","st","nd","rd"], v = n % 100;
  return n + (s[(v - 20) % 10] || s[v] || s[0]);
}

async function tick() {
  try {
    const [venue, surge, orbit, all] = await Promise.all([
      j(`/api/venues/${venueId}`),
      j(`/api/venues/${venueId}/surge`),
      j(`/api/venues/${venueId}/orbit`),
      j(`/api/venues`),
    ]);

    $("venue").textContent = venue.name || "—";
    document.title = `VIIBE — ${venue.name}`;

    const lvl = $("level");
    lvl.textContent = surge.level_label || "DORMANT";
    lvl.classList.toggle("electric", surge.level === "electric");
    document.documentElement.style.setProperty("--lvl", surge.level_color || "#5544FF");
    $("glow").style.opacity = 0.10 + 0.22 * (surge.charge_pct || 0);

    $("bar-fill").style.width = Math.round((surge.charge_pct || 0) * 100) + "%";
    $("next").innerHTML = surge.next_level
      ? `<b>${surge.taps_to_next}</b> CHARGES TO <b>${surge.next_level}</b> — TAP THE REACTOR`
      : `MAX CHARGE — <b>THE ROOM IS THE SIGNAL</b>`;

    $("scouts").textContent = orbit.watching_present + (surge.checkin_count || 0);
    $("watchers").textContent = orbit.watching_remote;

    const ranked = all
      .filter(v => (v.city || "") === (venue.city || ""))
      .sort((a, b) => (b.current_vibe_score || 0) - (a.current_vibe_score || 0));
    const rank = ranked.findIndex(v => v.id === venueId) + 1;
    $("strata-n").textContent = rank > 0 ? ordinal(rank) : "—";

    $("err").style.display = "none";
  } catch (e) {
    $("err").style.display = "block";
  }
}

tick();
setInterval(tick, 8000);
</script>
</body>
</html>
